<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="seaGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#718B83" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#18363A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10191C" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="corkWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A57D52"/>
      <stop offset="60%" stop-color="#C29D74"/>
      <stop offset="100%" stop-color="#845D35"/>
    </linearGradient>
    <linearGradient id="parchmentScroll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E0"/>
      <stop offset="50%" stop-color="#E8D8B5"/>
      <stop offset="100%" stop-color="#C9B388"/>
    </linearGradient>
  </defs>

  <!-- Water Ripple Ripples at Base -->
  <ellipse cx="80" cy="142" rx="48" ry="8" fill="#18363A" fill-opacity="0.6"/>
  <ellipse cx="80" cy="142" rx="36" ry="5" fill="none" stroke="#718B83" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Tilted Bottle Group -->
  <g transform="rotate(-18 80 80)">
    <!-- Glass Bottle Body -->
    <path d="M 66 38 L 94 38 L 94 56 C 94 64 108 76 108 92 L 108 126 C 108 134 102 138 94 138 L 66 138 C 58 138 52 134 52 126 L 52 92 C 52 76 66 64 66 56 Z" fill="url(#seaGlass)" stroke="#718B83" stroke-width="2"/>

    <!-- Glass Specular Highlight Curve -->
    <path d="M 58 92 L 58 126 C 58 130 60 134 66 134" fill="none" stroke="#F4EBDD" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
    <path d="M 70 42 L 70 54" fill="none" stroke="#F4EBDD" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>

    <!-- Rolled Parchment Scroll Inside -->
    <rect x="62" y="80" width="36" height="46" rx="4" transform="rotate(8 80 103)" fill="url(#parchmentScroll)" stroke="#49382A" stroke-width="1.2"/>
    <!-- Red Wax Seal Ribbon on Scroll -->
    <rect x="61" y="98" width="38" height="6" transform="rotate(8 80 103)" fill="#96352E" stroke="#5C1B17" stroke-width="0.8"/>
    <circle cx="80" cy="102" r="5" fill="#B33E35" stroke="#E8D8B5" stroke-width="1"/>
    <!-- Scroll Text Lines Hint -->
    <line x1="68" y1="88" x2="88" y2="90" stroke="#49382A" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="69" y1="94" x2="86" y2="96" stroke="#49382A" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="72" y1="114" x2="90" y2="116" stroke="#49382A" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Bottle Neck Lip Ring -->
    <rect x="63" y="34" width="34" height="6" rx="2" fill="url(#seaGlass)" stroke="#718B83" stroke-width="1.8"/>

    <!-- Weathered Cork Stopper -->
    <polygon points="67,34 93,34 90,18 70,18" fill="url(#corkWood)" stroke="#553920" stroke-width="1.5"/>
    <ellipse cx="80" cy="18" rx="10" ry="3" fill="#D4AF85" stroke="#553920" stroke-width="1"/>

    <!-- Red Wax Seal Dripping on Cork -->
    <path d="M 72 20 Q 80 26 88 20 Q 83 30 78 30 Q 75 28 72 20 Z" fill="#96352E" stroke="#5C1B17" stroke-width="0.8"/>
  </g>
</svg>
