<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" width="100%" height="100%" class="treasure-chest-svg">
  <defs>
    <linearGradient id="chestWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#553920"/>
      <stop offset="40%" stop-color="#402814"/>
      <stop offset="100%" stop-color="#241508"/>
    </linearGradient>
    <linearGradient id="lidWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#734B28"/>
      <stop offset="60%" stop-color="#50331A"/>
      <stop offset="100%" stop-color="#341F0E"/>
    </linearGradient>
    <linearGradient id="chestGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B89555"/>
      <stop offset="35%" stop-color="#E5C788"/>
      <stop offset="70%" stop-color="#B89555"/>
      <stop offset="100%" stop-color="#6B5224"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2A3" stop-opacity="1"/>
      <stop offset="45%" stop-color="#E5C788" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#B89555" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B89555" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="90" cy="130" rx="72" ry="10" fill="#080D0E" fill-opacity="0.8"/>

  <!-- Golden Treasure Glow (Emerges on open) -->
  <g class="chest-glow-aura" opacity="0">
    <ellipse cx="90" cy="65" rx="55" ry="30" fill="url(#innerGlow)"/>
    <circle cx="90" cy="65" r="40" fill="url(#innerGlow)"/>
    <!-- Floating Sparkles -->
    <polygon points="90,45 92,50 97,50 93,53 95,58 90,55 85,58 87,53 83,50 88,50" fill="#FFF8DE"/>
    <polygon points="65,55 66,58 70,58 67,60 68,64 65,62 62,64 63,60 60,58 64,58" fill="#FFF8DE"/>
    <polygon points="115,55 116,58 120,58 117,60 118,64 115,62 112,64 113,60 110,58 114,58" fill="#FFF8DE"/>
  </g>

  <!-- CHEST BASE -->
  <g class="chest-body">
    <!-- Main Wooden Box Hull -->
    <path d="M 25 65 L 155 65 L 148 122 C 148 125 145 127 141 127 L 39 127 C 35 127 32 125 32 122 Z" fill="url(#chestWood)" stroke="#1a0f05" stroke-width="2"/>

    <!-- Wood Plank Lines -->
    <line x1="28" y1="84" x2="152" y2="84" stroke="#241508" stroke-width="1.8"/>
    <line x1="30" y1="104" x2="150" y2="104" stroke="#241508" stroke-width="1.8"/>

    <!-- Iron/Brass Straps (Left, Middle, Right) -->
    <!-- Left Strap -->
    <path d="M 46 65 L 48 127 L 58 127 L 56 65 Z" fill="url(#chestGold)" stroke="#3d2c12" stroke-width="1"/>
    <!-- Middle Strap -->
    <rect x="83" y="65" width="14" height="62" fill="url(#chestGold)" stroke="#3d2c12" stroke-width="1"/>
    <!-- Right Strap -->
    <path d="M 124 65 L 122 127 L 132 127 L 134 65 Z" fill="url(#chestGold)" stroke="#3d2c12" stroke-width="1"/>

    <!-- Brass Rivets on Base Straps -->
    <g fill="#241508">
      <circle cx="52" cy="74" r="1.8"/><circle cx="53" cy="94" r="1.8"/><circle cx="53" cy="118" r="1.8"/>
      <circle cx="90" cy="74" r="1.8"/><circle cx="90" cy="94" r="1.8"/><circle cx="90" cy="118" r="1.8"/>
      <circle cx="128" cy="74" r="1.8"/><circle cx="127" cy="94" r="1.8"/><circle cx="127" cy="118" r="1.8"/>
    </g>
    <!-- Rivet Highlights -->
    <g fill="#F4EBDD">
      <circle cx="51.5" cy="73.5" r="0.7"/><circle cx="52.5" cy="93.5" r="0.7"/><circle cx="52.5" cy="117.5" r="0.7"/>
      <circle cx="89.5" cy="73.5" r="0.7"/><circle cx="89.5" cy="93.5" r="0.7"/><circle cx="89.5" cy="117.5" r="0.7"/>
      <circle cx="127.5" cy="73.5" r="0.7"/><circle cx="126.5" cy="93.5" r="0.7"/><circle cx="126.5" cy="117.5" r="0.7"/>
    </g>

    <!-- Side Carrying Handles (Brass drop rings) -->
    <path d="M 28 88 C 22 88 18 96 22 102 C 26 108 30 102 30 96" fill="none" stroke="url(#chestGold)" stroke-width="3"/>
    <path d="M 152 88 C 158 88 162 96 158 102 C 154 108 150 102 150 96" fill="none" stroke="url(#chestGold)" stroke-width="3"/>
  </g>

  <!-- CHEST HINGED LID (Can tilt/rotate on open) -->
  <g class="chest-lid" style="transform-origin: 90px 65px; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);">
    <!-- Arched Curved Lid Geometry -->
    <path d="M 20 65 Q 90 20 160 65 L 158 68 Q 90 28 22 68 Z" fill="url(#lidWood)" stroke="#1a0f05" stroke-width="1.5"/>
    <path d="M 20 65 Q 90 22 160 65 L 157 60 Q 90 15 23 60 Z" fill="#684220"/>

    <!-- Full Arched Dome Fill -->
    <path d="M 22 65 C 22 42 50 24 90 24 C 130 24 158 42 158 65 Z" fill="url(#lidWood)" stroke="#1a0f05" stroke-width="1.5"/>

    <!-- Wood grain curves on lid -->
    <path d="M 23 52 Q 90 18 157 52" fill="none" stroke="#241508" stroke-width="1.4"/>
    <path d="M 24 40 Q 90 12 156 40" fill="none" stroke="#241508" stroke-width="1.2"/>

    <!-- Curved Brass Straps on Lid -->
    <path d="M 44 65 C 44 44 48 30 52 24 L 62 25 C 57 32 54 45 54 65 Z" fill="url(#chestGold)" stroke="#3d2c12" stroke-width="1"/>
    <path d="M 83 65 C 83 40 85 24 85 24 L 95 24 C 95 24 97 40 97 65 Z" fill="url(#chestGold)" stroke="#3d2c12" stroke-width="1"/>
    <path d="M 126 65 C 126 45 123 32 118 25 L 128 24 C 132 30 136 44 136 65 Z" fill="url(#chestGold)" stroke="#3d2c12" stroke-width="1"/>

    <!-- Lid Rim Trim -->
    <path d="M 20 63 L 160 63 L 160 67 L 20 67 Z" fill="url(#chestGold)" stroke="#3d2c12" stroke-width="1"/>

    <!-- Brass Rivets on Lid -->
    <g fill="#241508">
      <circle cx="50" cy="52" r="1.6"/><circle cx="53" cy="36" r="1.6"/>
      <circle cx="90" cy="52" r="1.6"/><circle cx="90" cy="36" r="1.6"/>
      <circle cx="130" cy="52" r="1.6"/><circle cx="127" cy="36" r="1.6"/>
    </g>

    <!-- Center Antique Lock Hasp & Escutcheon Plate -->
    <path d="M 82 56 L 98 56 L 98 78 C 98 83 94 86 90 86 C 86 86 82 83 82 78 Z" fill="url(#chestGold)" stroke="#3d2c12" stroke-width="1.5"/>

    <!-- Keyhole -->
    <circle cx="90" cy="70" r="3.2" fill="#10191C"/>
    <polygon points="88.5,70 91.5,70 92.5,77 87.5,77" fill="#10191C"/>

    <!-- Lock Shackle / Padlock Detailing -->
    <circle cx="90" cy="62" r="4" fill="none" stroke="#F4EBDD" stroke-width="1.2"/>
  </g>
</svg>
