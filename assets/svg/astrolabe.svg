<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="astrolabeBrass" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F4EBDD"/>
      <stop offset="25%" stop-color="#E5C788"/>
      <stop offset="70%" stop-color="#B89555"/>
      <stop offset="100%" stop-color="#5C451D"/>
    </radialGradient>
  </defs>

  <!-- Top Suspension Throne & Shackle Ring -->
  <circle cx="80" cy="14" r="8" fill="none" stroke="#B89555" stroke-width="2.5"/>
  <path d="M 68 28 C 72 20 88 20 92 28 L 88 34 C 84 32 76 32 72 34 Z" fill="url(#astrolabeBrass)" stroke="#49382A" stroke-width="1"/>

  <!-- Mater (Main Rim) -->
  <circle cx="80" cy="92" r="58" fill="#18363A" fill-opacity="0.8" stroke="url(#astrolabeBrass)" stroke-width="6"/>
  <circle cx="80" cy="92" r="54" fill="none" stroke="#B89555" stroke-width="1" stroke-opacity="0.8"/>
  <circle cx="80" cy="92" r="50" fill="none" stroke="#E8D8B5" stroke-width="0.8" stroke-dasharray="2,2" stroke-opacity="0.5"/>

  <!-- Celestial Coordinate Stereographic Curves (Tympan) -->
  <path d="M 38 92 A 42 42 0 0 1 122 92" fill="none" stroke="#B89555" stroke-width="1" stroke-opacity="0.6"/>
  <path d="M 46 92 A 34 34 0 0 1 114 92" fill="none" stroke="#B89555" stroke-width="0.8" stroke-opacity="0.5"/>
  <path d="M 55 92 A 25 25 0 0 1 105 92" fill="none" stroke="#B89555" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="80" y1="38" x2="80" y2="146" stroke="#B89555" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="26" y1="92" x2="134" y2="92" stroke="#B89555" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Rete (Openwork Star Map Ring & Pointers) -->
  <circle cx="80" cy="92" r="32" fill="none" stroke="#E5C788" stroke-width="2" stroke-opacity="0.9"/>
  <path d="M 62 76 Q 80 84 98 76 Q 80 108 62 76 Z" fill="none" stroke="#E5C788" stroke-width="1.8"/>

  <!-- Star Flame Pointers -->
  <polygon points="62,76 56,72 63,73" fill="#F4EBDD"/>
  <polygon points="98,76 104,72 97,73" fill="#F4EBDD"/>
  <polygon points="80,60 80,52 82,60" fill="#F4EBDD"/>
  <polygon points="80,124 80,132 78,124" fill="#F4EBDD"/>

  <!-- Alidade (Sighting Rule Arm Across Face) -->
  <line x1="32" y1="126" x2="128" y2="58" stroke="url(#astrolabeBrass)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Sight vanes with pinholes -->
  <rect x="44" y="112" width="6" height="8" transform="rotate(-35 47 116)" fill="#49382A" stroke="#B89555" stroke-width="1"/>
  <rect x="110" y="66" width="6" height="8" transform="rotate(-35 113 70)" fill="#49382A" stroke="#B89555" stroke-width="1"/>

  <!-- Center Pin (Horse/Wedge Axle) -->
  <circle cx="80" cy="92" r="7" fill="url(#astrolabeBrass)" stroke="#49382A" stroke-width="1.5"/>
  <circle cx="80" cy="92" r="2.5" fill="#10191C"/>
</svg>

