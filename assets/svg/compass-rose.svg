<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="brassGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E5C788"/>
      <stop offset="50%" stop-color="#B89555"/>
      <stop offset="85%" stop-color="#80622C"/>
      <stop offset="100%" stop-color="#49381A"/>
    </radialGradient>
    <radialGradient id="centerGem" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#718B83"/>
      <stop offset="70%" stop-color="#18363A"/>
      <stop offset="100%" stop-color="#10191C"/>
    </radialGradient>
  </defs>

  <!-- Outer Bezel Rings -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#B89555" stroke-width="2.5" stroke-opacity="0.85"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#B89555" stroke-width="0.8" stroke-dasharray="2,3" stroke-opacity="0.6"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#B89555" stroke-width="1.2" stroke-opacity="0.5"/>
  <circle cx="100" cy="100" r="68" fill="none" stroke="#B89555" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Degree Ticks -->
  <g stroke="#B89555" stroke-opacity="0.5" stroke-width="1">
    <line x1="100" y1="8" x2="100" y2="14"/>
    <line x1="100" y1="186" x2="100" y2="192"/>
    <line x1="8" y1="100" x2="14" y2="100"/>
    <line x1="186" y1="100" x2="192" y2="100"/>
    <!-- 45 deg ticks -->
    <line x1="35" y1="35" x2="40" y2="40"/>
    <line x1="165" y1="35" x2="160" y2="40"/>
    <line x1="35" y1="165" x2="40" y2="160"/>
    <line x1="165" y1="165" x2="160" y2="160"/>
  </g>

  <!-- Secondary Points (NW, NE, SE, SW) -->
  <g transform="rotate(45 100 100)">
    <!-- Point 1 -->
    <polygon points="100,28 106,100 100,92" fill="#80622C" fill-opacity="0.9"/>
    <polygon points="100,28 94,100 100,92" fill="#E8D8B5" fill-opacity="0.8"/>
    <!-- Point 2 -->
    <polygon points="100,172 106,100 100,108" fill="#E8D8B5" fill-opacity="0.8"/>
    <polygon points="100,172 94,100 100,108" fill="#80622C" fill-opacity="0.9"/>
    <!-- Point 3 -->
    <polygon points="28,100 100,106 92,100" fill="#E8D8B5" fill-opacity="0.8"/>
    <polygon points="28,100 100,94 92,100" fill="#80622C" fill-opacity="0.9"/>
    <!-- Point 4 -->
    <polygon points="172,100 100,106 108,100" fill="#80622C" fill-opacity="0.9"/>
    <polygon points="172,100 100,94 108,100" fill="#E8D8B5" fill-opacity="0.8"/>
  </g>

  <!-- Major Points (N, S, E, W) -->
  <!-- North Point (Fleur-de-lis styled tip) -->
  <polygon points="100,12 108,100 100,88" fill="#B89555"/>
  <polygon points="100,12 92,100 100,88" fill="#F4EBDD"/>
  <!-- South Point -->
  <polygon points="100,188 108,100 100,112" fill="#6B5224"/>
  <polygon points="100,188 92,100 100,112" fill="#B89555"/>
  <!-- East Point -->
  <polygon points="188,100 100,108 112,100" fill="#6B5224"/>
  <polygon points="188,100 100,92 112,100" fill="#B89555"/>
  <!-- West Point -->
  <polygon points="12,100 100,108 88,100" fill="#B89555"/>
  <polygon points="12,100 100,92 88,100" fill="#F4EBDD"/>

  <!-- Center Hub Brass Ring & Pivot -->
  <circle cx="100" cy="100" r="18" fill="url(#brassGrad)" stroke="#49381A" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="12" fill="url(#centerGem)" stroke="#B89555" stroke-width="1"/>
  <circle cx="100" cy="100" r="4" fill="#F4EBDD"/>

  <!-- Direction Labels in Classic Serif -->
  <text x="100" y="27" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-weight="bold" font-size="13" fill="#F4EBDD" text-anchor="middle">N</text>
  <text x="100" y="180" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-weight="bold" font-size="11" fill="#B89555" text-anchor="middle">S</text>
  <text x="178" y="104" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-weight="bold" font-size="11" fill="#B89555" text-anchor="middle">E</text>
  <text x="22" y="104" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-weight="bold" font-size="11" fill="#B89555" text-anchor="middle">W</text>
</svg>

